<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <!-- 修改点 ①：更宽松的 viewport，支持用户缩放，适应不同浏览器 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>财务小助理 · 智能问答</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f0f4fb;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: #1e293b;
        }

        /* ===== 顶部导航 ===== */
        .custom-header {
            background: rgba(11, 26, 51, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 12px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.08);
            z-index: 20;
            min-height: 68px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-logo {
            width: 44px;
            height: 44px;
            background: linear-gradient(145deg, #f6d365, #fda085);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: #0b1a33;
            box-shadow: 0 8px 24px rgba(253, 160, 133, 0.35);
        }

        .header-title {
            color: #ffffff;
            font-weight: 600;
            font-size: 20px;
            letter-spacing: -0.2px;
        }

        .header-title span {
            background: linear-gradient(135deg, #f6d365, #fda085);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-sub {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-badge {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            color: rgba(255, 255, 255, 0.85);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-badge i {
            color: #34d399;
            font-size: 10px;
        }

        /* ===== 主内容区 ===== */
        .main-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .iframe-container {
            width: 100%;
            height: 100%;
            background: #ffffff;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        /* ===== 底部状态栏 ===== */
        .custom-footer {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 8px 28px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #94a3b8;
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            flex-shrink: 0;
        }

        .custom-footer .footer-left i {
            color: #34d399;
            margin-right: 6px;
            font-size: 8px;
        }

        .custom-footer .footer-right i {
            color: #f59e0b;
            margin-right: 6px;
        }

        /* ===== 移动端上传提示条（新增） ===== */
        .upload-tip {
            display: none;
            background: rgba(245, 158, 11, 0.12);
            border-left: 4px solid #f59e0b;
            padding: 10px 16px;
            font-size: 13px;
            color: #92400e;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }
        .upload-tip i {
            font-size: 18px;
            color: #f59e0b;
        }
        .upload-tip .tip-close {
            margin-left: auto;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 20px;
            background: rgba(0,0,0,0.05);
            font-size: 14px;
            color: #78350f;
        }
        .upload-tip .tip-close:hover {
            background: rgba(0,0,0,0.1);
        }
        @media (max-width: 819px) {
            .upload-tip {
                display: flex;
            }
        }

        /* ===== 桌面端反馈面板 ===== */
        .feedback-panel-desktop {
            display: none;
        }

        /* ===== 手机端悬浮按钮 ===== */
        .feedback-float {
            position: fixed;
            bottom: 140px;
            right: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
        }

        .feedback-float .float-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            transition: all 0.2s ease;
            color: #fff;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .feedback-float .float-btn i {
            font-size: 20px;
        }

        .feedback-float .float-btn.solved {
            background: rgba(5, 150, 105, 0.9);
        }

        .feedback-float .float-btn.unsolved {
            background: rgba(220, 38, 38, 0.9);
        }

        .feedback-float .float-btn:active {
            transform: scale(0.92);
        }

        /* ===== 模态框 ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 32px;
            max-width: 500px;
            width: 100%;
            padding: 32px 32px 28px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.15);
            transform: translateY(30px) scale(0.96);
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .modal-overlay.active .modal-box {
            transform: translateY(0) scale(1);
        }

        .modal-box h2 {
            font-size: 22px;
            font-weight: 700;
            color: #0b1a33;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .modal-box h2 i {
            color: #dc2626;
            background: rgba(239, 68, 68, 0.10);
            padding: 10px;
            border-radius: 16px;
            font-size: 20px;
        }

        .modal-box .modal-sub {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.6;
            padding-left: 4px;
        }

        .modal-box .form-group {
            margin-bottom: 18px;
        }

        .modal-box .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 5px;
            letter-spacing: 0.2px;
        }

        .modal-box .form-group label .required {
            color: #dc2626;
            margin-left: 2px;
        }

        .modal-box .form-group label i {
            color: #94a3b8;
            margin-right: 6px;
        }

        .modal-box .form-group textarea,
        .modal-box .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(226, 232, 240, 0.6);
            border-radius: 14px;
            font-size: 14px;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition: all 0.2s ease;
            color: #1e293b;
            outline: none;
        }

        .modal-box .form-group textarea {
            min-height: 90px;
            resize: vertical;
        }

        .modal-box .form-group textarea:focus,
        .modal-box .form-group input:focus {
            border-color: #f59e0b;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.10);
        }

        .modal-box .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .modal-box .form-actions button {
            flex: 1;
            padding: 12px 0;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .modal-box .form-actions .btn-primary {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: #ffffff;
            box-shadow: 0 4px 16px rgba(220, 38, 38, 0.25);
        }

        .modal-box .form-actions .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(220, 38, 38, 0.35);
        }

        .modal-box .form-actions .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .modal-box .form-actions .btn-secondary {
            background: rgba(255, 255, 255, 0.5);
            color: #475569;
            border: 1px solid rgba(226, 232, 240, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .modal-box .form-actions .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.8);
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 200px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: white;
            padding: 14px 28px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            transition: opacity 0.4s ease, transform 0.4s ease;
            opacity: 0;
            transform: translateX(-50%) translateY(10px);
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.08);
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            background: rgba(5, 150, 105, 0.92);
        }

        .toast.error {
            background: rgba(220, 38, 38, 0.92);
        }

        /* ===== 桌面端布局 ===== */
        @media (min-width: 820px) {
            .main-wrapper {
                display: flex;
                flex-direction: row;
                background: #f0f4fb;
            }

            .iframe-container {
                flex: 1;
                margin: 12px 0 12px 12px;
                border-radius: 24px;
                box-shadow: 0 20px 60px rgba(0, 20, 40, 0.08);
                border: 1px solid rgba(255, 255, 255, 0.3);
                overflow: hidden;
                height: auto;
            }

            .feedback-panel-desktop {
                display: flex;
                flex-direction: column;
                width: 260px;
                background: rgba(255, 255, 255, 0.7);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border-left: 1px solid rgba(255, 255, 255, 0.5);
                padding: 28px 20px;
                gap: 18px;
                flex-shrink: 0;
                overflow-y: auto;
                margin: 12px 12px 12px 0;
                border-radius: 24px;
                box-shadow: 0 20px 60px rgba(0, 20, 40, 0.06);
                border: 1px solid rgba(255, 255, 255, 0.5);
            }

            .feedback-panel-desktop .panel-header {
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .feedback-panel-desktop .panel-header i {
                font-size: 22px;
                color: #f59e0b;
                background: rgba(245, 158, 11, 0.12);
                padding: 8px;
                border-radius: 12px;
            }

            .feedback-panel-desktop .panel-header h4 {
                font-size: 16px;
                font-weight: 600;
                color: #0b1a33;
                margin: 0;
            }

            .feedback-panel-desktop .panel-desc {
                font-size: 13px;
                color: #64748b;
                line-height: 1.5;
                margin-top: -4px;
                padding-left: 4px;
            }

            .feedback-panel-desktop .feedback-btn-group {
                display: flex;
                flex-direction: column;
                gap: 10px;
                margin-top: 4px;
            }

            .feedback-panel-desktop .feedback-btn {
                padding: 12px 0;
                border: none;
                border-radius: 16px;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                background: rgba(255, 255, 255, 0.6);
                backdrop-filter: blur(4px);
                -webkit-backdrop-filter: blur(4px);
                border: 1px solid rgba(255, 255, 255, 0.4);
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            }

            .feedback-panel-desktop .feedback-btn.solved {
                color: #059669;
                background: rgba(52, 211, 153, 0.12);
                border-color: rgba(52, 211, 153, 0.25);
            }

            .feedback-panel-desktop .feedback-btn.solved:hover {
                background: rgba(52, 211, 153, 0.22);
                transform: translateY(-2px) scale(1.02);
                box-shadow: 0 8px 24px rgba(52, 211, 153, 0.20);
            }

            .feedback-panel-desktop .feedback-btn.unsolved {
                color: #dc2626;
                background: rgba(239, 68, 68, 0.08);
                border-color: rgba(239, 68, 68, 0.15);
            }

            .feedback-panel-desktop .feedback-btn.unsolved:hover {
                background: rgba(239, 68, 68, 0.18);
                transform: translateY(-2px) scale(1.02);
                box-shadow: 0 8px 24px rgba(239, 68, 68, 0.15);
            }

            .feedback-panel-desktop .feedback-btn i {
                font-size: 18px;
            }

            .feedback-panel-desktop .feedback-note {
                font-size: 12px;
                color: #94a3b8;
                text-align: center;
                padding-top: 6px;
                border-top: 1px dashed rgba(148, 163, 184, 0.2);
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
            }

            .feedback-panel-desktop .feedback-note i {
                color: #f59e0b;
            }

            .feedback-float {
                display: none;
            }

            /* 桌面端隐藏提示条 */
            .upload-tip {
                display: none !important;
            }
        }

        /* ===== 手机端（<820px） ===== */
        @media (max-width: 819px) {
            .feedback-panel-desktop {
                display: none !important;
            }
            .feedback-float {
                display: flex;
                bottom: 150px;
            }
            .custom-header {
                padding: 10px 16px;
                min-height: 56px;
            }
            .header-logo {
                width: 34px;
                height: 34px;
                font-size: 16px;
            }
            .header-title {
                font-size: 16px;
            }
            .header-sub {
                font-size: 10px;
            }
            .header-badge {
                font-size: 10px;
                padding: 4px 12px;
            }
            .custom-footer {
                font-size: 10px;
                padding: 4px 16px;
            }
            .iframe-container {
                height: auto;
                flex: 1;
            }
        }

        @media (max-width: 480px) {
            .feedback-float .float-btn {
                width: 48px;
                height: 48px;
                font-size: 10px;
                bottom: 140px;
            }
            .feedback-float .float-btn i {
                font-size: 16px;
            }
            .modal-box {
                padding: 24px 18px;
            }
        }
    </style>
</head>
<body>

    <header class="custom-header">
        <div class="header-left">
            <div class="header-logo"><i class="fas fa-calculator"></i></div>
            <div>
                <div class="header-title">财务<span>小助理</span></div>
                <div class="header-sub">智能问答 · 基于 DEAP</div>
            </div>
        </div>
        <div class="header-right">
            <span class="header-badge"><i class="fas fa-circle"></i> 在线</span>
        </div>
    </header>

    <!-- 修改点 ②：新增移动端上传提示条，引导用户使用系统浏览器 -->
    <div class="upload-tip" id="uploadTip">
        <i class="fas fa-info-circle"></i>
        <span>如无法上传图片，请点击右上角「…」用系统浏览器打开</span>
        <span class="tip-close" id="tipClose"><i class="fas fa-times"></i></span>
    </div>

    <div class="main-wrapper">
        <div class="iframe-container" id="iframeContainer">
            <!--
            修改点 ③：扩充 iframe 权限，加入 native-file-system，并保留所有常见功能
            -->
            <iframe
                id="deapIframe"
                src="https://deap-agent.dingtalk.com/h5/index.html?publish_h5=1&code=0df84989-3a53-47ab-b08f-407a5670fc12"
                allow="accelerometer; ambient-light-sensor; autoplay; camera; display-capture; encrypted-media; fullscreen; geolocation; gyroscope; magnetometer; microphone; midi; payment; picture-in-picture; publickey-credentials-get; screen-wake-lock; sync-xhr; usb; xr-spatial-tracking; clipboard-read; clipboard-write; native-file-system"
                allowfullscreen
                loading="lazy"
            ></iframe>
        </div>

        <!-- 桌面端反馈面板 -->
        <div class="feedback-panel-desktop" id="desktopPanel">
            <div class="panel-header"><i class="fas fa-comment-dots"></i><h4>问题反馈</h4></div>
            <div class="panel-desc">该回答是否解决了您的问题？</div>
            <div class="feedback-btn-group">
                <button class="feedback-btn solved" id="solvedBtnDesktop"><i class="fas fa-check-circle"></i> 已解决</button>
                <button class="feedback-btn unsolved" id="unsolvedBtnDesktop"><i class="fas fa-times-circle"></i> 未解决</button>
            </div>
            <div class="feedback-note"><i class="fas fa-info-circle"></i> 未解决将通知管理员</div>
        </div>
    </div>

    <!-- 手机端悬浮按钮 -->
    <div class="feedback-float" id="floatPanel">
        <button class="float-btn solved" id="solvedBtnFloat"><i class="fas fa-check-circle"></i><span>已解决</span></button>
        <button class="float-btn unsolved" id="unsolvedBtnFloat"><i class="fas fa-times-circle"></i><span>未解决</span></button>
    </div>

    <div class="custom-footer">
        <span class="footer-left"><i class="fas fa-circle"></i> 服务正常</span>
        <span class="footer-right"><i class="fas fa-lock"></i> 钉钉安全加密</span>
    </div>

    <!-- 反馈弹窗 -->
    <div class="modal-overlay" id="feedbackModal">
        <div class="modal-box">
            <h2><i class="fas fa-exclamation-circle"></i> 问题未解决</h2>
            <p class="modal-sub">请填写您的餐厅编号和问题描述，我们将通知该餐厅负责人。</p>
            <div class="form-group">
                <label><i class="fas fa-store"></i> 您的餐厅编号 <span class="required">*</span></label>
                <input type="text" id="restaurantCode" placeholder="请输入餐厅编号（如：0103）" />
            </div>
            <div class="form-group">
                <label><i class="fas fa-pencil-alt"></i> 您刚才问了什么问题？ <span class="required">*</span></label>
                <textarea id="issueDesc" placeholder="请简述您刚才向智能体提出的问题，以及为什么认为回答未解决"></textarea>
            </div>
            <div class="form-actions">
                <button class="btn-secondary" id="modalCancel">取消</button>
                <button class="btn-primary" id="modalSubmit"><i class="fas fa-paper-plane"></i> 提交反馈</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const API_BACKEND = 'https://feedbacroxy-web-sigigkprpt.cn-hangzhou.fcapp.run';

            // ============================================================
            //  📌 餐厅编号 ↔ 对接人 完整映射表（含手机号）
            // ============================================================
            const RESTAURANT_MAP = {
                // ...（此处省略，与之前完全一致，请自行粘贴完整映射表）...
                // 为避免篇幅，建议您将原映射表完整复制过来。
                // 实际使用时请确保包含所有餐厅编号。
            };

            // ============================================================

            function adjustIframeHeight() {
                const isMobile = window.innerWidth < 820;
                if (!isMobile) return;
                const header = document.querySelector('.custom-header');
                const footer = document.querySelector('.custom-footer');
                const container = document.getElementById('iframeContainer');
                if (!container || !header || !footer) return;
                const headerHeight = header.offsetHeight;
                const footerHeight = footer.offsetHeight;
                const availHeight = window.innerHeight - headerHeight - footerHeight - 4;
                container.style.height = availHeight + 'px';
                container.style.minHeight = '300px';
            }

            window.addEventListener('load', function() {
                adjustIframeHeight();
                setTimeout(adjustIframeHeight, 300);
            });
            window.addEventListener('resize', adjustIframeHeight);

            // ===== 关闭上传提示条 =====
            document.getElementById('tipClose').addEventListener('click', function() {
                const tip = document.getElementById('uploadTip');
                tip.style.display = 'none';
            });

            const solvedBtns = document.querySelectorAll('#solvedBtnDesktop, #solvedBtnFloat');
            const unsolvedBtns = document.querySelectorAll('#unsolvedBtnDesktop, #unsolvedBtnFloat');
            const modal = document.getElementById('feedbackModal');
            const cancelBtn = document.getElementById('modalCancel');
            const submitBtn = document.getElementById('modalSubmit');
            const restaurantCode = document.getElementById('restaurantCode');
            const issueDesc = document.getElementById('issueDesc');

            function showToast(message, type) {
                const existing = document.querySelector('.toast');
                if (existing) existing.remove();
                const toast = document.createElement('div');
                toast.className = 'toast';
                if (type === 'success') toast.classList.add('success');
                if (type === 'error') toast.classList.add('error');
                toast.textContent = message;
                document.body.appendChild(toast);
                requestAnimationFrame(() => toast.classList.add('show'));
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 500);
                }, 3000);
            }

            // ===== 发送函数（传递手机号用于 @ 对接人） =====
            async function sendDingTalkMessage(restCode, issue) {
                const contact = RESTAURANT_MAP[restCode] || null;
                const contactName = contact ? contact.name : '未找到对接人';
                const contactPhone = contact ? contact.phone : '';

                const atMobiles = contactPhone ? [contactPhone] : [];

                try {
                    const response = await fetch(API_BACKEND, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            user: restCode,
                            contact: contactName,
                            desc: issue,
                            atMobiles: atMobiles
                        })
                    });
                    const result = await response.json();
                    if (result.success) {
                        showToast('✅ 反馈已发送，对接人将收到通知', 'success');
                    } else {
                        showToast('❌ 提交失败：' + (result.error || '未知错误'), 'error');
                    }
                } catch (e) {
                    showToast('❌ 网络异常，请稍后重试', 'error');
                }
            }

            solvedBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    showToast('✅ 已解决，感谢您的反馈！', 'success');
                });
            });

            unsolvedBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    restaurantCode.value = '';
                    issueDesc.value = '';
                    modal.classList.add('active');
                    setTimeout(() => {
                        if (window.innerWidth < 820) {
                            restaurantCode.focus();
                        }
                    }, 400);
                });
            });

            function closeModal() {
                modal.classList.remove('active');
            }
            cancelBtn.addEventListener('click', closeModal);
            modal.addEventListener('click', function(e) {
                if (e.target === modal) closeModal();
            });

            submitBtn.addEventListener('click', async function() {
                const code = restaurantCode.value.trim();
                const issue = issueDesc.value.trim();
                if (!code) { showToast('请填写您的餐厅编号', 'error');
                    restaurantCode.focus(); return; }
                if (!issue) { showToast('请描述您刚才问了什么问题', 'error');
                    issueDesc.focus(); return; }
                if (!RESTAURANT_MAP[code]) {
                    showToast('❌ 餐厅编号不存在，请核对后重新输入', 'error');
                    restaurantCode.focus();
                    return;
                }
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 发送中...';
                await sendDingTalkMessage(code, issue);
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> 提交反馈';
                closeModal();
            });

            document.getElementById('deapIframe').addEventListener('load', function() {
                console.log('✅ DEAP 智能体已加载');
                setTimeout(adjustIframeHeight, 200);
            });
        })();
    </script>
</body>
</html>
