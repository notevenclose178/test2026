    <style>

            padding: 0;
            box-sizing: border-box;
        }

        body {

            background: #f0f4fb;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: #1e293b;
        }

        .custom-header {
            background: rgba(11, 26, 51, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 12px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.08);
            z-index: 20;
            min-height: 68px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-logo {
            width: 44px;
            height: 44px;
            background: linear-gradient(145deg, #f6d365, #fda085);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: #0b1a33;
            box-shadow: 0 8px 24px rgba(253, 160, 133, 0.35);
        }

        .header-title {
            color: #ffffff;
            font-weight: 600;
            font-size: 20px;
            letter-spacing: -0.2px;
        }

        .header-title span {
            background: linear-gradient(135deg, #f6d365, #fda085);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-sub {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-badge {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            color: rgba(255, 255, 255, 0.85);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-badge i {
            color: #34d399;
            font-size: 10px;
        }

        .main-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .iframe-container {
            width: 100%;
            height: 100%;
            background: #ffffff;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .custom-footer {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 8px 28px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #94a3b8;
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            flex-shrink: 0;
        }

        .custom-footer .footer-left i {
            color: #34d399;
            margin-right: 6px;
            font-size: 8px;
        }

        .custom-footer .footer-right i {
            color: #f59e0b;
            margin-right: 6px;
        }

        .feedback-panel-desktop {
            display: none;
        }

        .feedback-float {
            position: fixed;
            bottom: 140px;
            right: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
        }

        .feedback-float .float-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            transition: all 0.2s ease;
            color: #fff;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .feedback-float .float-btn i {
            font-size: 20px;
        }

        .feedback-float .float-btn.solved {
            background: rgba(5, 150, 105, 0.9);
        }

        .feedback-float .float-btn.unsolved {
            background: rgba(220, 38, 38, 0.9);
        }

        .feedback-float .float-btn:active {
            transform: scale(0.92);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 32px;
            max-width: 500px;
            width: 100%;
            padding: 32px 32px 28px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.15);
            transform: translateY(30px) scale(0.96);
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .modal-overlay.active .modal-box {
            transform: translateY(0) scale(1);
        }

        .modal-box h2 {
            font-size: 22px;
            font-weight: 700;
            color: #0b1a33;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .modal-box h2 i {
            color: #dc2626;
            background: rgba(239, 68, 68, 0.10);
            padding: 10px;
            border-radius: 16px;
            font-size: 20px;
        }

        .modal-box .modal-sub {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.6;
            padding-left: 4px;
        }

        .modal-box .form-group {
            margin-bottom: 18px;
        }

        .modal-box .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 5px;
            letter-spacing: 0.2px;
        }

        .modal-box .form-group label .required {
            color: #dc2626;
            margin-left: 2px;
        }

        .modal-box .form-group label i {
            color: #94a3b8;
            margin-right: 6px;
        }

        .modal-box .form-group textarea,
        .modal-box .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(226, 232, 240, 0.6);
            border-radius: 14px;
            font-size: 14px;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition: all 0.2s ease;
            color: #1e293b;
            outline: none;
        }

        .modal-box .form-group textarea {
            min-height: 90px;
            resize: vertical;
        }

        .modal-box .form-group textarea:focus,
        .modal-box .form-group input:focus {
            border-color: #f59e0b;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.10);
        }

        .modal-box .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .modal-box .form-actions button {
            flex: 1;
            padding: 12px 0;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .modal-box .form-actions .btn-primary {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: #ffffff;
            box-shadow: 0 4px 16px rgba(220, 38, 38, 0.25);
        }

        .modal-box .form-actions .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(220, 38, 38, 0.35);
        }

        .modal-box .form-actions .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .modal-box .form-actions .btn-secondary {
            background: rgba(255, 255, 255, 0.5);
            color: #475569;
            border: 1px solid rgba(226, 232, 240, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .modal-box .form-actions .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.8);
        }

        .toast {
            position: fixed;
            bottom: 200px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: white;
            padding: 14px 28px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            transition: opacity 0.4s ease, transform 0.4s ease;
            opacity: 0;
            transform: translateX(-50%) translateY(10px);
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.08);
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            background: rgba(5, 150, 105, 0.92);
        }

        .toast.error {
            background: rgba(220, 38, 38, 0.92);
        }

            }

            .feedback-panel-desktop .panel-header {
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .feedback-panel-desktop .panel-header i {
                font-size: 22px;
                color: #f59e0b;
                background: rgba(245, 158, 11, 0.12);
                padding: 8px;
                border-radius: 12px;
            }

            .feedback-panel-desktop .panel-header h4 {
                font-size: 16px;
                font-weight: 600;
                color: #0b1a33;
                margin: 0;

                font-size: 13px;
                color: #64748b;
                line-height: 1.5;
                margin-top: -4px;
                padding-left: 4px;
            }

            .feedback-panel-desktop .feedback-btn-group {
                display: flex;
                flex-direction: column;
                gap: 10px;
                margin-top: 4px;
            }

            .feedback-panel-desktop .feedback-btn {
                padding: 12px 0;
                border: none;
                border-radius: 16px;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                background: rgba(255, 255, 255, 0.6);
                backdrop-filter: blur(4px);
                -webkit-backdrop-filter: blur(4px);
                border: 1px solid rgba(255, 255, 255, 0.4);
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            }

            .feedback-panel-desktop .feedback-btn.solved {
                color: #059669;
                background: rgba(52, 211, 153, 0.12);
                border-color: rgba(52, 211, 153, 0.25);
            }

            .feedback-panel-desktop .feedback-btn.solved:hover {
                background: rgba(52, 211, 153, 0.22);
                transform: translateY(-2px) scale(1.02);
                box-shadow: 0 8px 24px rgba(52, 211, 153, 0.20);
            }

            .feedback-panel-desktop .feedback-btn.unsolved {
                color: #dc2626;
                background: rgba(239, 68, 68, 0.08);
                border-color: rgba(239, 68, 68, 0.15);
            }

            .feedback-panel-desktop .feedback-btn.unsolved:hover {
                background: rgba(239, 68, 68, 0.18);
                transform: translateY(-2px) scale(1.02);
                box-shadow: 0 8px 24px rgba(239, 68, 68, 0.15);
            }

            .feedback-panel-desktop .feedback-btn i {

            }

                color: #94a3b8;
                text-align: center;
                padding-top: 6px;
                border-top: 1px dashed rgba(148, 163, 184, 0.2);

                align-items: center;
                justify-content: center;
                gap: 6px;
            }

            .feedback-panel-desktop .feedback-note i {
                color: #f59e0b;
            }

            .feedback-float {
                display: none;
            }

            .iframe-container {

        @media (max-width: 480px) {
            .feedback-float .float-btn {

                height: 48px;

            }
            .feedback-float .float-btn i {

            }
            .modal-box {
                padding: 24px 18px;
            }

            // ============================================================

            function adjustIframeHeight() {
                const isMobile = window.innerWidth < 820;
                if (!isMobile) return;
                const header = document.querySelector('.custom-header');
                const footer = document.querySelector('.custom-footer');
                const container = document.getElementById('iframeContainer');
                if (!container || !header || !footer) return;
                const headerHeight = header.offsetHeight;
                const footerHeight = footer.offsetHeight;
                const availHeight = window.innerHeight - headerHeight - footerHeight - 4;
                container.style.height = availHeight + 'px';
                container.style.minHeight = '300px';
            }

            window.addEventListener('load', function() {
                adjustIframeHeight();
                setTimeout(adjustIframeHeight, 300);
            });
            window.addEventListener('resize', adjustIframeHeight);

            const solvedBtns = document.querySelectorAll('#solvedBtnDesktop, #solvedBtnFloat');
            const unsolvedBtns = document.querySelectorAll('#unsolvedBtnDesktop, #unsolvedBtnFloat');
            const modal = document.getElementById('feedbackModal');
            const cancelBtn = document.getElementById('modalCancel');
            const submitBtn = document.getElementById('modalSubmit');
            const restaurantCode = document.getElementById('restaurantCode');
            const issueDesc = document.getElementById('issueDesc');

            function showToast(message, type) {
                const existing = document.querySelector('.toast');
                if (existing) existing.remove();
                const toast = document.createElement('div');
                toast.className = 'toast';
                if (type === 'success') toast.classList.add('success');
                if (type === 'error') toast.classList.add('error');
                toast.textContent = message;
                document.body.appendChild(toast);
                requestAnimationFrame(() => toast.classList.add('show'));
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 500);
                }, 3000);
            }

            async function sendDingTalkMessage(restCode, issue) {
                const contact = RESTAURANT_MAP[restCode] || null;
                const contactName = contact ? contact.name : '未找到对接人';
                const contactPhone = contact ? contact.phone : '';
                const atMobiles = contactPhone ? [contactPhone] : [];

                try {
                    const response = await fetch(API_BACKEND, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            user: restCode,
                            contact: contactName,
                            desc: issue,
                            atMobiles: atMobiles
                        })
                    });
                    const result = await response.json();
                    if (result.success) {
                        showToast('✅ 反馈已发送，对接人将收到通知', 'success');
                    } else {
                        showToast('❌ 提交失败：' + (result.error || '未知错误'), 'error');
                    }
                } catch (e) {
                    showToast('❌ 网络异常，请稍后重试', 'error');
                }
            }

            solvedBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    showToast('✅ 已解决，感谢您的反馈！', 'success');
                });
            });

            unsolvedBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    restaurantCode.value = '';
                    issueDesc.value = '';
                    modal.classList.add('active');
                    setTimeout(() => {
                        if (window.innerWidth < 820) {
                            restaurantCode.focus();
                        }
                    }, 400);
                });
            });

            function closeModal() {
                modal.classList.remove('active');
            }
            cancelBtn.addEventListener('click', closeModal);
            modal.addEventListener('click', function(e) {
                if (e.target === modal) closeModal();
            });

            submitBtn.addEventListener('click', async function() {
                const code = restaurantCode.value.trim();
                const issue = issueDesc.value.trim();
                if (!code) { showToast('请填写您的餐厅编号', 'error');
                    restaurantCode.focus(); return; }
                if (!issue) { showToast('请描述您刚才问了什么问题', 'error');
                    issueDesc.focus(); return; }
                if (!RESTAURANT_MAP[code]) {
                    showToast('❌ 餐厅编号不存在，请核对后重新输入', 'error');
                    restaurantCode.focus();
                    return;
                }
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 发送中...';
                await sendDingTalkMessage(code, issue);
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> 提交反馈';
                closeModal();
            });

            document.getElementById('deapIframe').addEventListener('load', function() {
                console.log('✅ DEAP 智能体已加载');
                setTimeout(adjustIframeHeight, 200);
            });
        })();
